# The gate every change must pass. ENGINEERING_GUIDE §12 requires typecheck and
# tests to be green before review; §11 makes the production bundle a tracked
# budget, so we build here too rather than discovering breakage at release.
#
# Turborepo fans these out across the workspace, so adding a package needs no
# change here: a package with a `typecheck`/`test`/`build` script is picked up
# automatically.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Reads the version from the root package.json "packageManager" field, so
      # local and CI cannot drift apart.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile fails rather than silently resolving a new tree, which
      # is what makes the lockfile meaningful.
      - run: pnpm install --frozen-lockfile

      # Runs at the root, not through turbo: the §2 dependency law is a
      # cross-package property, so it is checked over the whole graph at once.
      - name: Lint and boundary law
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Report bundle size
        # Informational for now. It becomes a hard budget once the extraction
        # settles and the numbers stop moving with every feature.
        run: du -sh apps/studio/dist && du -ah apps/studio/dist/assets | sort -rh | head -20

  render:
    name: the renderer still draws
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # A real browser, driving the real production build.
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      - run: pnpm build

      - name: Serve the build
        # Bound to 127.0.0.1 explicitly. Left to default, preview listens on
        # `localhost`, which the runner resolves to ::1 first while the harness asks
        # for 127.0.0.1 — so the wait times out against a server that is running.
        run: |
          pnpm --filter @geomotion/studio exec vite preview --port 5173 --host 127.0.0.1 &
          npx --yes wait-on http://127.0.0.1:5173 --timeout 60000

      # NOT a pixel comparison. GPU rasterisation differs between drivers, and
      # headless software rendering differs from both, so a committed baseline would
      # mismatch here for reasons that are not regressions — that check stays a local
      # tool. These properties describe a single run rather than comparing two, so
      # they hold anywhere: every frame renders, none is blank, no two are identical,
      # the overlay contributes, and the page logs no errors.
      - name: Render smoke
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          GOLDEN_URL: http://127.0.0.1:5173/
        run: pnpm --filter @geomotion/testing golden:smoke

  pipeline:
    name: the pipeline still produces a video
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      # ffmpeg is not on the runner image; the pipeline muxes and probes with it.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - run: pnpm build

      - name: Render the fixture
        # A 2s, 30-frame composition — long enough to exercise the whole path, short
        # enough that software rendering on a runner is not the slowest job here.
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          ffmpeg -y -v error -f lavfi -i "sine=frequency=440:duration=2" -ar 48000 /tmp/tone.wav
          node apps/pipeline/render-project.mjs \
            apps/pipeline/fixtures/ci-smoke.geomotion.json --draft --audio=/tmp/tone.wav

      # The exit code above only says ffmpeg ran. These are the properties that were
      # wrong while it exited 0: a draft that reframed a square composition to
      # widescreen, and `-shortest` dropping the audio stream while logging the mapping
      # and succeeding. The fixture is square precisely because 1:1 is where the aspect
      # bug bit and 16:9 would not have shown it.
      - name: Check the video is the one the project asked for
        run: |
          node apps/pipeline/tools/check-render.mjs \
            apps/pipeline/out/ci-smoke-draft/ci-smoke-draft.mp4 \
            --width=720 --height=720 --fps=15 --duration=2 --audio

  secrets:
    name: no credentials in the tree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Scan tracked files for API keys
        # An OpenRouter key was once pasted into a chat log; keys belong in
        # gitignored .env.local and nowhere else. This fails the build rather
        # than letting one reach a public commit.
        run: |
          set -uo pipefail
          patterns='sk-or-v1-[0-9a-f]{32}|sk-ant-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{35}|ghp_[0-9A-Za-z]{36}'
          if git grep -nIE "$patterns" -- . ':!.github/workflows/ci.yml'; then
            echo "::error::A credential-shaped string is committed. Rotate the key, then remove it from the tree."
            exit 1
          fi
          echo "No credential patterns found in tracked files."
