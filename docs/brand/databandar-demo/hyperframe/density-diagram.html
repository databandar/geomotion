<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #05070A; }
      body { font-family: 'Arial', sans-serif; }
      .dot {
        position: absolute;
        width: 14px; height: 14px;
        border-radius: 50%;
        background: #3a4048;
      }
      .dot.hot { background: #22C55E; box-shadow: 0 0 0px rgba(34,197,94,0); }
      .band {
        position: absolute;
        border-radius: 18px;
        border: 1.5px solid rgba(34,197,94,0.55);
        background: rgba(34,197,94,0.07);
      }
      .label {
        position: absolute;
        color: #F2F4F5;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      .label.green { color: #22C55E; }
      .tag {
        position: absolute;
        color: #9AA5AF;
        font-weight: 500;
        font-size: 15px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="3.6"
      data-width="1080"
      data-height="1920"
      style="position: relative; width: 1080px; height: 1920px; background: #05070A;"
    >
      <!--
        100 dots, one per percent of humanity. 50 of them (the bottom five rows) are packed
        into a tight cluster; the other 50 are spread across the rest of the same grid area.
        Same dot count on both sides of the story — only the packing differs, which is the
        whole idea rendered as a shape instead of stated as a sentence.
      -->
      <div id="grid" style="position:absolute; left:140px; top:560px; width:800px; height:800px;"></div>
      <div id="clusterBand" class="band" style="left:140px; top:960px; width:800px; height:400px; opacity:0;"></div>
      <div id="sparseBand" class="band" style="left:140px; top:560px; width:800px; height:400px; opacity:0; border-color: rgba(154,165,175,0.35); background: rgba(154,165,175,0.04);"></div>

      <div id="bigStat" class="label" style="left:0; top:1440px; width:1080px; text-align:center; font-size:88px; opacity:0;">
        HALF OF HUMANITY
      </div>
      <div id="subStat" class="label green" style="left:0; top:1560px; width:1080px; text-align:center; font-size:44px; opacity:0;">
        13% OF THE LAND
      </div>
      <div id="tagCluster" class="tag" style="left:140px; top:1370px; opacity:0;">50 of 100 — packed tight</div>
      <div id="tagSparse" class="tag" style="left:140px; top:500px; opacity:0;">the other 50 — spread wide</div>
    </div>

    <script>
      const grid = document.getElementById('grid');
      const cell = 80; // 10x10 grid over an 800x800 box
      const dotOffset = (cell - 14) / 2;
      const dots = [];
      for (let row = 0; row < 10; row++) {
        for (let col = 0; col < 10; col++) {
          const d = document.createElement('div');
          d.className = 'dot';
          // Bottom five rows (row 5-9) are the "hot" / densely-explained half.
          const hot = row >= 5;
          if (hot) d.classList.add('hot');
          d.dataset.row = row;
          d.dataset.col = col;
          d.dataset.hot = hot ? '1' : '0';
          d.style.left = (col * cell + dotOffset) + 'px';
          d.style.top = (row * cell + dotOffset) + 'px';
          grid.appendChild(d);
          dots.push(d);
        }
      }

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Sparse half (top five rows) scatters outward to fill the whole upper 3/4 of the grid
      // box, spreading 50 dots thin. The hot half stays packed tight in its own small band —
      // the SAME 50-dot count, two radically different footprints. That contrast is the idea.
      const hotDots = dots.filter((d) => d.dataset.hot === '1');
      const coldDots = dots.filter((d) => d.dataset.hot === '0');

      tl.set(dots, { opacity: 0, scale: 0.3 });
      tl.to(dots, { opacity: 1, scale: 1, duration: 0.35, stagger: { each: 0.003, from: 'random' } }, 0.05);

      /*
       * Both blocks retarget each dot's pitch (the grid's native 80px) to a new effective
       * pitch, as a delta from its original position — col-4.5 / row-2 centers the transform
       * on the block's own middle, so widening or narrowing doesn't drift the whole block off
       * its label. Cold dots go to a slightly wider 90px pitch (using more of the band with
       * room to spare); hot dots go to a tight 40px pitch (a small fraction of the same band).
       * The first version of this pushed the pack math the wrong direction — positive when it
       * needed to be negative — which spread the "packed" dots instead of packing them; caught
       * by rendering it, not by reading the arithmetic back.
       */
      const cold_pitch = 90, hot_pitch = 40, base_pitch = 80;
      coldDots.forEach((d) => {
        const col = Number(d.dataset.col);
        const spreadX = (col - 4.5) * (cold_pitch - base_pitch);
        tl.to(d, { x: spreadX, duration: 0.7, ease: 'power2.out' }, 0.5);
      });
      hotDots.forEach((d) => {
        const col = Number(d.dataset.col);
        const rowInBlock = Number(d.dataset.row) - 5;
        const packX = (col - 4.5) * (hot_pitch - base_pitch);
        const packY = (rowInBlock - 2) * (hot_pitch - base_pitch);
        tl.to(d, { x: packX, y: packY, duration: 0.7, ease: 'power2.out', scale: 1.15 }, 0.5);
        tl.to(d, { boxShadow: '0 0 14px rgba(34,197,94,0.85)', duration: 0.3 }, 1.15);
      });

      tl.to('#clusterBand', { opacity: 1, duration: 0.3 }, 1.3);
      tl.to('#sparseBand', { opacity: 1, duration: 0.3 }, 1.3);
      tl.to('#tagCluster', { opacity: 1, duration: 0.25 }, 1.5);
      tl.to('#tagSparse', { opacity: 1, duration: 0.25 }, 1.5);
      tl.fromTo('#bigStat', { y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }, 1.75);
      tl.to('#subStat', { opacity: 1, duration: 0.35 }, 2.05);

      // Hold on the full composition so the cut into the globe has a settled frame to match.
      // Extended from an original 0.3s: the narration line spoken over this clip (measured,
      // not estimated) runs 3.35s, longer than the animation itself — rather than cut the
      // line short, the clip holds its finished state longer. The motion that earns attention
      // (dots resolving, the two groups pulling apart) is already over by ~2.4s regardless.
      tl.to({}, { duration: 1.3 }, 2.3);

      window.__timelines['main'] = tl;
    </script>
  </body>
</html>
